// ---------- Geometría ----------
function geometria(a) {
  const s = POS[a.origen], t = POS[a.destino];
  if (esVertical(a)) {
    const abajo = t[1] > s[1];
    const sx = s[0] + N / 2, tx = t[0] + N / 2;
    const sy = abajo ? s[1] + N + LH + 4 : s[1] - 6;
    const ty = abajo ? t[1] - 6 : t[1] + N + LH + 4;
    const dy = (ty - sy) / 2;
    return { tipo: "bez", p: [[sx, sy], [sx, sy + dy], [tx, ty - dy], [tx, ty]] };
  }
  const sx = s[0] + N + 6, sy = s[1] + N / 2, tx = t[0] - 6, ty = t[1] + N / 2;
  const r = CARRILES[a.id];
  if (r) {
    const ox = sx + r.salida, ix = tx - r.entrada;
    return { tipo: "step", f: r.etiqueta ?? 0.5, p: [[sx, sy], [ox, sy], [ox, r.carril], [ix, r.carril], [ix, ty], [tx, ty]] };
  }
  const dx = Math.max(50, (tx - sx) / 2);
  return { tipo: "bez", p: [[sx, sy], [sx + dx, sy], [tx - dx, ty], [tx, ty]] };
}
function trazo(g) {
  const p = g.p;
  if (g.tipo === "bez") return `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`;
  let d = `M${p[0]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [a, b, c] = [p[i - 1], p[i], p[i + 1]];
    const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
    const r = Math.min(12, l1 / 2, l2 / 2);
    if (!l1 || !l2) continue;
    const p1 = [b[0] - ((b[0] - a[0]) / l1) * r, b[1] - ((b[1] - a[1]) / l1) * r];
    const p2 = [b[0] + ((c[0] - b[0]) / l2) * r, b[1] + ((c[1] - b[1]) / l2) * r];
    d += ` L${p1} Q${b} ${p2}`;
  }
  return d + ` L${p[p.length - 1]}`;
}
function flecha(g) {
  const p = g.p, to = p[p.length - 1], from = p[p.length - 2];
  const dx = to[0] - from[0], dy = to[1] - from[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const b = [to[0] - ux * 9, to[1] - uy * 9];
  return `M${to} L${b[0] - uy * 4.5},${b[1] + ux * 4.5} L${b[0] + uy * 4.5},${b[1] - ux * 4.5} Z`;
}
function medio(g) {
  const p = g.p;
  if (g.tipo === "bez") return [(p[0][0] + 3 * p[1][0] + 3 * p[2][0] + p[3][0]) / 8, (p[0][1] + 3 * p[1][1] + 3 * p[2][1] + p[3][1]) / 8];
  return [p[2][0] + (p[3][0] - p[2][0]) * g.f, p[2][1]];
}

// ---------- Dibujo ----------
const lienzo = document.getElementById("lienzo");
const mundo = document.getElementById("mundo");
const panel = document.getElementById("panel");
const cajaPaso = document.getElementById("paso");
const botonRecorrer = document.getElementById("recorrer");
const W = 2560, H = 2100;

function dibujar() {
  let html = "";
  for (const s of NOTAS) {
    const xs = s.nodos.map((id) => POS[id][0]), ys = s.nodos.map((id) => POS[id][1]);
    const x = Math.min(...xs) - 46, y = Math.min(...ys) - 74;
    const w = Math.max(...xs) + N + 46 - x, h = Math.max(...ys) + N + 52 - y;
    html += `<div class="sticky s-${s.color}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><h3>${esc(s.titulo)}</h3><p style="max-width:${s.ancho_texto}px">${esc(s.texto)}</p></div>`;
  }

  const g = new Map(aristas.map((a) => [a.id, geometria(a)]));
  let svg = `<svg id="aristas" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (const a of aristas) {
    const ge = g.get(a.id), d = trazo(ge);
    const cls = `edge t-${a.tipo}${a.sincronia === "asincrona" ? " async" : ""}`;
    const tit = `${a.id} · ${nodos.get(a.origen).nombre} → ${nodos.get(a.destino).nombre}: ${a.descripcion}`;
    svg += `<g class="${cls}" data-id="${a.id}"><title>${esc(tit)}</title><path class="line" d="${d}"/><path class="arrow" d="${flecha(ge)}"/><path class="hit" d="${d}"/></g>`;
  }
  for (const [id, i] of pasoDe) {
    const [x, y] = medio(g.get(id));
    svg += `<g class="paso" data-edge="${id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle r="11"/><text>${i + 1}</text></g>`;
  }
  html += svg + "</svg>";

  const entra = new Set(), sale = new Set(), arriba = new Set(), abajo = new Set();
  for (const a of aristas) {
    if (!esVertical(a)) { sale.add(a.origen); entra.add(a.destino); continue; }
    if (POS[a.destino][1] > POS[a.origen][1]) { abajo.add(a.origen); arriba.add(a.destino); }
    else { arriba.add(a.origen); abajo.add(a.destino); }
  }
  for (const n of D.nodos) {
    const [x, y] = POS[n.id];
    const c = D.carga.capacidad[n.id];
    const fase = n.fase !== "mvp" ? `<span class="badge fase">${T_FASE[n.fase] ?? n.fase}</span>` : "";
    const rho = c ? `<span class="badge rho rho-${estado(c.rho)}" title="Uso en el pico de 10.000 sesiones">ρ ${fmtRho(c.rho)}</span>` : "";
    html += `<div class="node g-${GRUPO[n.tipo]}${TRIGGER.has(n.id) ? " trigger" : ""}${n.fase !== "mvp" ? " later" : ""}" data-id="${n.id}" style="left:${x}px;top:${y}px">
      ${TRIGGER.has(n.id) ? '<svg class="trig" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>' : ""}
      <button type="button" class="box" aria-label="${esc(n.nombre)} (${n.id})">${icono(n.id)}${entra.has(n.id) ? '<span class="h h-in"></span>' : ""}${sale.has(n.id) ? '<span class="h h-out"></span>' : ""}${fase}${rho}<span class="ok-badge">${CHECK}</span></button>
      <div class="label"><b>${esc(n.nombre)}</b><small>${n.id} · ${T_TIPO[n.tipo]}</small></div>
      ${arriba.has(n.id) ? '<span class="h h-top"></span>' : ""}${abajo.has(n.id) ? '<span class="h h-bot"></span>' : ""}
    </div>`;
  }
  mundo.innerHTML = html;
}

function aristasDeVista(v) {
  return new Set(aristas.filter((a) => (v.ids ? v.ids.includes(a.id) : v.filtro(a))).map((a) => a.id));

function aplicarClases() {
  const enVista = aristasDeVista(vista);
  const nodosVista = new Set();
  for (const id of enVista) { const a = arista.get(id); nodosVista.add(a.origen); nodosVista.add(a.destino); }
  if (vista.id === "todo") for (const n of D.nodos) nodosVista.add(n.id);

  let foco = null; // aristas y nodos relacionados con la selección
  if (sel) {
    foco = { e: new Set(), n: new Set() };
    if (sel.k === "node") {
      foco.n.add(sel.id);
      for (const a of aristas) if (a.origen === sel.id || a.destino === sel.id) { foco.e.add(a.id); foco.n.add(a.origen); foco.n.add(a.destino); }
    } else {
      const a = arista.get(sel.id);
      foco.e.add(a.id); foco.n.add(a.origen); foco.n.add(a.destino);
    }
  }
  const hechos = new Set(), activo = walk.on ? PASOS[walk.i][0] : null;
  if (walk.on) for (let i = 0; i < walk.i; i++) hechos.add(PASOS[i][0]);

  for (const el of mundo.querySelectorAll(".edge")) {
    const id = el.dataset.id;
    const out = !enVista.has(id);
    el.classList.toggle("out", out);
    el.classList.toggle("fade", !out && !!foco && !foco.e.has(id) && !walk.on);
    el.classList.toggle("hl", !!foco && foco.e.has(id));
    el.classList.toggle("sel", !!sel && sel.k === "edge" && sel.id === id && !walk.on);
    el.classList.toggle("done", hechos.has(id));
    el.classList.toggle("active", id === activo);
  }
  for (const el of mundo.querySelectorAll(".paso")) {
    el.classList.toggle("done", hechos.has(el.dataset.edge));
    el.classList.toggle("active", el.dataset.edge === activo);
  }
  const nodosHechos = new Set(), nodoActivo = activo ? arista.get(activo).destino : null;
  for (const id of hechos) { const a = arista.get(id); nodosHechos.add(a.origen); nodosHechos.add(a.destino); }
  if (activo) nodosHechos.add(arista.get(activo).origen);
  for (const el of mundo.querySelectorAll(".node")) {
    const id = el.dataset.id;
    const out = !nodosVista.has(id);
    el.classList.toggle("out", out);
    el.classList.toggle("fade", !out && !!foco && !foco.n.has(id) && !walk.on);
    el.classList.toggle("sel", !!sel && sel.k === "node" && sel.id === id);
    el.classList.toggle("done", nodosHechos.has(id) && id !== nodoActivo);
    el.classList.toggle("run", id === nodoActivo);
  }
  document.getElementById("aristas").classList.toggle("ver-pasos", vista.id === "pedido");
}

// ---------- Vista y zoom ----------
let vx = 0, vy = 0, vk = 0.5;
function aplicar(anim) {
  const a = !!anim && !reduce;
  mundo.classList.toggle("anim", a);
  lienzo.classList.toggle("anim", a);
  mundo.style.transform = `translate(${vx}px, ${vy}px) scale(${vk})`;
  lienzo.style.backgroundSize = `${20 * vk}px ${20 * vk}px`;
  lienzo.style.backgroundPosition = `${vx}px ${vy}px`;
}
const limitar = (k) => Math.min(2, Math.max(0.15, k));
function zoomEn(px, py, f) {
  const k = limitar(vk * f), wx = (px - vx) / vk, wy = (py - vy) / vk;
  vk = k; vx = px - wx * k; vy = py - wy * k; aplicar();
}
function ajustar(ids, anim = true, maxK = 1.1) {
  const xs = ids.map((id) => POS[id][0]), ys = ids.map((id) => POS[id][1]);
  const x0 = Math.min(...xs) - 70, y0 = Math.min(...ys) - 90, x1 = Math.max(...xs) + N + 70, y1 = Math.max(...ys) + N + 70;
  const r = lienzo.getBoundingClientRect();
  const k = limitar(Math.min(r.width / (x1 - x0), r.height / (y1 - y0), maxK));
  vk = k;
  vx = (r.width - (x1 - x0) * k) / 2 - x0 * k;
  vy = (r.height - (y1 - y0) * k) / 2 - y0 * k;
  aplicar(anim);
}
function idsDeVista(v) {
  if (v.id === "todo") return D.nodos.map((n) => n.id);
  const s = new Set();
  for (const id of aristasDeVista(v)) { const a = arista.get(id); s.add(a.origen); s.add(a.destino); }
  return [...s];
}
function centrarEn(id, anim = true) {
  const r = lienzo.getBoundingClientRect();
  const k = Math.max(vk, 0.85);
  vk = limitar(k);
  vx = r.width / 2 - (POS[id][0] + N / 2) * vk;
  vy = r.height / 2 - (POS[id][1] + N / 2 + 20) * vk;
  aplicar(anim);
}

// ---------- Panel ----------
const chipsDe = (lista) => `<div class="chips">${lista.filter(Boolean).map((c) => `<span class="chip">${c}</span>`).join("")}</div>`;
const botonNodo = (id) => `<button type="button" class="link" data-node="${id}">${esc(nodos.get(id).nombre)}</button>`;
const telemetriaDe = (id) => D.telemetria.filter((t) => new RegExp(`\\b${id}\\b`).test(t.objeto));
const restriccionesDe = (id) => D.restricciones.filter((r) => (R_MAP[r.id] ?? []).includes(id));

function capacidadTexto(c) {
  if (!c) return "Sin capacidad declarada en el grafo";
  if (c.nivel_anthropic) return `Nivel ${esc(c.nivel_anthropic)} de la cuenta de Anthropic`;
  if (c.mu_por_replica != null) {
    const rep = D.servicios[c.servicio]?.replicas;
    return `${fmt(c.mu_por_replica)} por segundo por réplica × ${rep} réplicas del servicio ${esc(c.servicio)}`;
  }
  return `${fmt(c.mu_por_s)} por segundo${c.por_instancia ? " por marca" : ""}`;
}
function filaArista(a, dir) {
  const otro = dir === "in" ? a.origen : a.destino;
  return `<button type="button" class="row" data-edge="${a.id}"><span class="mono">${a.id}</span><span class="who">${dir === "in" ? "desde" : "hacia"} ${esc(nodos.get(otro).nombre)}</span><span class="tp">${a.tipo}</span><span class="ds">${esc(a.descripcion)}</span></button>`;
}
function listaT(ts) {
  if (!ts.length) return "";
  return `<h3>Telemetría</h3><ul>${ts.map((t) => `<li><span class="mono">${t.id}</span> <b>${esc(t.nombre)}</b>: ${esc(t.formula)}. <span class="meta">Umbral: ${esc(t.umbral)}</span></li>`).join("")}</ul>`;
}
function listaR(rs) {
  if (!rs.length) return "";
  return `<h3>Restricciones de aislamiento</h3><ul>${rs.map((r) => `<li><span class="mono">${r.id}</span> ${esc(r.regla)} <span class="meta">${esc(r.mecanismo)}</span></li>`).join("")}</ul>`;
}

function panelNodo(id) {
  const n = nodos.get(id);
  const entradas = aristas.filter((a) => a.destino === id), salidas = aristas.filter((a) => a.origen === id);
  const cm = D.carga.mvp[id], cc = D.carga.capacidad[id];
  let h = `<div class="d-head g-${GRUPO[n.tipo]}"><span class="d-ico">${icono(id)}</span><div><h2>${esc(n.nombre)}</h2>
    ${chipsDe([`<span class="mono">${id}</span>`, T_TIPO[n.tipo], `capa ${esc(n.capa)}`, T_FASE[n.fase] ?? n.fase])}</div></div>
    <p>${esc(n.descripcion)}</p>
    <h3>Ficha</h3><dl class="kv">
      <dt>Gobernado por</dt><dd>${n.gobernado_por ? botonNodo(n.gobernado_por) : "Nadie: es la raíz del grafo"}</dd>
      <dt>Cardinalidad</dt><dd>${fmt(n.cardinalidad)}</dd>
      <dt>Capacidad</dt><dd>${capacidadTexto(n.capacidad)}${n.capacidad?.base ? `<small>${esc(n.capacidad.base)}</small>` : ""}</dd>
    </dl>`;
  if (cm || cc) {
    const fila = (nom, c) => (c ? `<tr><td>${nom}</td><td class="n">${fmt(c.lambda)}</td><td class="n">${fmt(c.mu)}</td><td class="n">${fmtRho(c.rho)}</td><td><span class="badge rho-${estado(c.rho)}" style="position:static">${estado(c.rho)}</span></td></tr>` : "");
    h += `<h3>Carga en el pico</h3><table class="tabla"><thead><tr><th>Escenario</th><th>Carga/s</th><th>Capacidad/s</th><th>ρ</th><th>Estado</th></tr></thead><tbody>
      ${fila("Lanzamiento del MVP", cm)}${fila("10.000 sesiones", cc)}</tbody></table>
      <p class="meta">Modelo de carga v${esc(D.modelo)}. ρ = carga / capacidad; alerta desde 0,7, crítico desde 0,9.</p>`;
  }
  if (entradas.length) h += `<h3>Entradas (${entradas.length})</h3><div class="rows">${entradas.map((a) => filaArista(a, "in")).join("")}</div>`;
  if (salidas.length) h += `<h3>Salidas (${salidas.length})</h3><div class="rows">${salidas.map((a) => filaArista(a, "out")).join("")}</div>`;
  return h + listaR(restriccionesDe(id)) + listaT(telemetriaDe(id));
}

function panelArista(id) {
  const a = arista.get(id);
  const crit = "●".repeat(a.peso.criticidad) + `<i>${"●".repeat(5 - a.peso.criticidad)}</i>`;
  const tm = D.tasas.mvp[id], tc = D.tasas.capacidad[id];
  const i = pasoDe.get(id);
  let h = `<div class="d-head"><div><h2><span class="mono">${a.id}</span> · ${esc(nodos.get(a.origen).nombre)} → ${esc(nodos.get(a.destino).nombre)}</h2>
    ${chipsDe([a.tipo, a.sincronia === "asincrona" ? "asíncrona" : "síncrona", a.idempotente ? "idempotente" : "no idempotente", `alcance ${T_ALC[a.alcance] ?? a.alcance}`, a.ruta_pedido ? "ruta del pedido" : "", i != null ? `paso ${i + 1} de ${PASOS.length}` : ""])}</div></div>
    <p>${esc(a.descripcion)}</p>
    <h3>Ficha</h3><dl class="kv">
      <dt>Origen</dt><dd>${botonNodo(a.origen)} <span class="mono meta">${a.origen}</span></dd>
      <dt>Destino</dt><dd>${botonNodo(a.destino)} <span class="mono meta">${a.destino}</span></dd>
      <dt>Latencia p95</dt><dd>${ms(a.peso.latencia_p95_ms)}</dd>
      <dt>Fricción media</dt><dd>${seg(a.peso.friccion_media_s)}</dd>
      <dt>Criticidad</dt><dd><span class="dots" aria-label="${a.peso.criticidad} de 5">${crit}</span></dd>

      <dt>Si falla</dt><dd>${a.respaldo ? esc(a.respaldo) : "—"}</dd>
      ${tm != null || tc != null ? `<dt>Tasa en el pico</dt><dd>${tm != null ? `${fmt(tm)}/s en el lanzamiento del MVP` : ""}${tc != null ? `<small>${fmt(tc)}/s con 10.000 sesiones</small>` : ""}</dd>` : ""}
    </dl>`;
  return h + listaR(restriccionesDe(id)) + listaT(telemetriaDe(id));
}

function panelVista() {
  const ea = aristasDeVista(vista), nn = idsDeVista(vista).length;
  const sw = (v) => `<span class="sw" style="background:var(${v})"></span>`;
  const lin = (t, async) => `<svg class="lg" viewBox="0 0 38 10" aria-hidden="true"><g class="edge t-${t}${async ? " async" : ""}"><path class="line" d="M1 5H37"/></g></svg>`;
  const ic = (g, id) => `<span class="ic g-${g}"><svg viewBox="0 0 24 24">${ICONS[id]}</svg></span>`;
  return `<h2>${esc(vista.nombre)}</h2>
    <p>${esc(vista.desc)}</p>
    <p class="meta">${nn} nodos y ${ea.size} aristas en esta vista, de ${D.nodos.length} y ${aristas.length} en total.</p>
    ${vista.id === "pedido" ? `<button type="button" class="btn" data-act="recorrer">${PLAY}Recorrer paso a paso</button>` : ""}
    <h3>Cómo moverse</h3>
    <ul>
      <li>Arrastra el lienzo para moverte. Ctrl + rueda, pellizcar o los botones + y − cambian el zoom.</li>
      <li>Haz clic en un nodo o en una línea para ver su ficha, sus conexiones y su telemetría.</li>

    </ul>
    <h3>Nodos</h3>
    <div class="legend">
      <div class="it">${ic("org", "N0")}Núcleo y gobierno</div>
      <div class="it">${ic("actor", "A2")}Compradores, marcas y sedes</div>
      <div class="it">${ic("serv", "P4")}Servicios de la plataforma</div>
      <div class="it">${ic("datos", "D1")}Datos</div>
      <div class="it">${ic("ext", "X1")}Servicios externos</div>
    </div>
    <p class="meta">Borde punteado: fase 2 o construcción. Lado izquierdo redondeado con rayo: donde empieza un flujo (N0 y los compradores).</p>
    <h3>Aristas</h3>
    <div class="legend">
      <div class="it">${lin("solicitud")}Solicitud</div>
      <div class="it">${lin("datos")}Datos</div>
      <div class="it">${lin("evento")}Evento</div>
      <div class="it">${lin("mensaje")}Mensaje</div>
      <div class="it">${lin("pago")}Pago</div>
      <div class="it">${lin("control")}Control (sale por debajo)</div>
      <div class="it">${lin("solicitud", true)}Punteada: asíncrona</div>
    </div>
    <h3>Uso en el pico</h3>
    <p>La etiqueta sobre algunos nodos es su uso en el pico de 10.000 sesiones simultáneas: ρ = carga / capacidad. ${sw("--ok")}hasta 0,7 ${sw("--warn")}alerta o crítico ${sw("--bad")}saturado.</p>
    <p>La marca (A2) aparece saturada porque acepta los pedidos a mano, uno por minuto. La protege la pausa automática al superar 15 pedidos pendientes (R06).</p>
    <p class="src">Fuente: arquitectura/grafo-operacional.json v${esc(D.version)} (${esc(D.fecha)}), kernel ${esc(D.kernel)} y modelo de carga v${esc(D.modelo)}.</p>`;
}

function pintarPanel() {
  panel.innerHTML = !sel ? panelVista() : sel.k === "node" ? panelNodo(sel.id) : panelArista(sel.id);
  if (!sel) return;
  panel.insertAdjacentHTML("afterbegin", `<button type="button" class="link" data-act="volver" style="margin-bottom:10px">← ${esc(vista.nombre)}</button>`);
}

function seleccionar(k, id, { centrar = false } = {}) {
  sel = k ? { k, id } : null;
  aplicarClases();
  pintarPanel();
  panel.scrollTop = 0;
  if (centrar && k === "node") centrarEn(id);
  if (centrar && k === "edge") { const a = arista.get(id); ajustar([a.origen, a.destino], true, 1); }
}

function ponerVista(id, { ajustarVista = true } = {}) {
  vista = VISTAS.find((v) => v.id === id) ?? VISTAS[0];
  if (walk.on && vista.id !== "pedido") terminar();
  for (const b of document.querySelectorAll("#vistas button")) b.setAttribute("aria-selected", String(b.dataset.view === vista.id));
  sel = null;
  aplicarClases();
  pintarPanel();
  if (ajustarVista) ajustar(idsDeVista(vista));
}

// ---------- Recorrido ----------
function pintarPaso() {
  const [id, txt] = PASOS[walk.i], a = arista.get(id);
  const ultimo = walk.i === PASOS.length - 1;
  cajaPaso.innerHTML = `<div class="w-top"><span><b>Paso ${walk.i + 1}</b> de ${PASOS.length}</span><span class="mono">${id}</span></div>
    <div class="w-ruta">${esc(nodos.get(a.origen).nombre)} → ${esc(nodos.get(a.destino).nombre)}</div>
    <p class="w-txt">${esc(txt)}</p>
    <div class="w-btns">
      <button type="button" data-w="prev" ${walk.i === 0 ? "disabled" : ""}>Anterior</button>
      <button type="button" data-w="play">${walk.playing ? "Pausar" : ultimo ? "Repetir" : "Reproducir"}</button>
      <button type="button" class="prim" data-w="next" ${ultimo ? "disabled" : ""}>Siguiente</button>
      <button type="button" data-w="stop">Terminar</button>
    </div>`;
}
function irA(i) {
  walk.i = Math.max(0, Math.min(PASOS.length - 1, i));
  const id = PASOS[walk.i][0], a = arista.get(id);
  sel = { k: "edge", id };
  aplicarClases();
  pintarPanel();
  pintarPaso();
  ajustar([a.origen, a.destino], true, 0.95);
  clearTimeout(walk.timer);
  if (walk.playing) {
    if (walk.i < PASOS.length - 1) walk.timer = setTimeout(() => irA(walk.i + 1), 3800);
    else { walk.playing = false; pintarPaso(); }
  }
}
function recorrer() {
  if (vista.id !== "pedido") ponerVista("pedido", { ajustarVista: false });
  walk.on = true;
  walk.playing = !reduce;
  botonRecorrer.hidden = true;
  cajaPaso.hidden = false;
  irA(0);
}
function terminar() {
  clearTimeout(walk.timer);
  walk.on = false; walk.playing = false;
  cajaPaso.hidden = true;
  botonRecorrer.hidden = false;
  sel = null;
  aplicarClases();
  pintarPanel();
}

// ---------- Eventos ----------
document.getElementById("vistas").innerHTML = VISTAS.map((v) => `<button type="button" role="tab" data-view="${v.id}" aria-selected="false">${esc(v.nombre)}</button>`).join("");
document.getElementById("vistas").addEventListener("click", (e) => { const b = e.target.closest("button[data-view]"); if (b) ponerVista(b.dataset.view); });
document.getElementById("chip-version").textContent = `v${D.version}`;
document.getElementById("chip-cuenta").textContent = `${D.nodos.length} nodos · ${aristas.length} aristas`;

const ptrs = new Map();
let movido = false, pinch = null;
lienzo.addEventListener("pointerdown", (e) => {
  movido = false;
  if (e.target.closest(".ctl")) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
lienzo.addEventListener("pointermove", (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (!movido && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 4) {
    movido = true;
    try { lienzo.setPointerCapture(e.pointerId); } catch {}
    lienzo.classList.add("grabbing");
  }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1 && movido) { vx += dx; vy += dy; aplicar(); }
  else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = lienzo.getBoundingClientRect();
    zoomEn((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch);
    pinch = d;
  }
});
const soltar = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) lienzo.classList.remove("grabbing"); };
lienzo.addEventListener("pointerup", soltar);
lienzo.addEventListener("pointercancel", soltar);
lienzo.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = lienzo.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomEn(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.01));
  else { vx -= e.deltaX; vy -= e.deltaY; aplicar(); }
}, { passive: false });
lienzo.addEventListener("click", (e) => {
  if (movido) return;
  const z = e.target.closest("[data-z]");
  if (z) {
    const r = lienzo.getBoundingClientRect();
    if (z.dataset.z === "fit") ajustar(idsDeVista(vista));
    else zoomEn(r.width / 2, r.height / 2, z.dataset.z === "in" ? 1.25 : 0.8);
    return;
  }
  const w = e.target.closest("[data-w]");
  if (w) {
    const accion = w.dataset.w;
    if (accion === "prev") irA(walk.i - 1);
    if (accion === "next") irA(walk.i + 1);
    if (accion === "stop") terminar();
    if (accion === "play") {
      if (walk.i === PASOS.length - 1 && !walk.playing) { walk.playing = true; irA(0); }
      else { walk.playing = !walk.playing; irA(walk.i); }
    }
    return;
  }
  if (e.target.closest(".ctl")) return;
  const nodo = e.target.closest(".node");
  if (nodo) { if (walk.on) terminar(); return seleccionar("node", nodo.dataset.id); }
  const ar = e.target.closest(".edge");
  if (ar) { if (walk.on) terminar(); return seleccionar("edge", ar.dataset.id); }
  if (!walk.on) seleccionar(null);
});
botonRecorrer.addEventListener("click", recorrer);
panel.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act === "recorrer") return recorrer();
  if (b.dataset.act === "volver") { if (walk.on) terminar(); return seleccionar(null); }
  if (walk.on) terminar();
  if (b.dataset.node) seleccionar("node", b.dataset.node, { centrar: true });
  if (b.dataset.edge) seleccionar("edge", b.dataset.edge, { centrar: true });
});
const verRho = document.getElementById("ver-rho");
try { if (localStorage.getItem("grafo-rho") === "0") verRho.checked = false; } catch {}
const pintarRho = () => lienzo.classList.toggle("sin-rho", !verRho.checked);
verRho.addEventListener("change", () => { pintarRho(); try { localStorage.setItem("grafo-rho", verRho.checked ? "1" : "0"); } catch {} });
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  const r = lienzo.getBoundingClientRect();
  if (e.key === "+" || e.key === "=") zoomEn(r.width / 2, r.height / 2, 1.25);
  else if (e.key === "-") zoomEn(r.width / 2, r.height / 2, 0.8);
  else if (e.key === "0") ajustar(idsDeVista(vista));
  else if (e.key === "Escape") { if (walk.on) terminar(); else seleccionar(null); }
  else if (walk.on && e.key === "ArrowRight") irA(walk.i + 1);
  else if (walk.on && e.key === "ArrowLeft") irA(walk.i - 1);
});
let ultimoAncho = 0;
new ResizeObserver(() => {
  const w = lienzo.clientWidth;
  if (Math.abs(w - ultimoAncho) > 40) { ultimoAncho = w; if (!walk.on && !sel) ajustar(idsDeVista(vista), false); }
