name: Verificaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificaciones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arquitectura:
    name: Arquitectura y modelo de carga
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Acciones fijadas por hash de commit; la versión va en el comentario.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: JSON válidos en arquitectura/
        run: |
          for f in arquitectura/*.json; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$f"
            echo "OK $f"
          done

      - name: Archivos generados del modelo de carga al día
        run: node tools/modelo-de-carga/calcular.mjs --check

      - name: Capacidad para el requisito de 10.000 sesiones simultáneas
        run: node tools/modelo-de-carga/calcular.mjs --estricto
