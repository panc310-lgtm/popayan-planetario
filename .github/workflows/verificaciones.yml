name: Verificaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificaciones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arquitectura:
    name: Arquitectura y modelo de carga
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Acciones fijadas por hash de commit; la versión va en el comentario.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Dependencias exactas del lockfile
        run: npm ci --no-audit --no-fund

      - name: Esquemas, estructura y referencias de la arquitectura
        run: node tools/validar-arquitectura/validar.mjs

      - name: Pruebas del validador
        run: node tools/validar-arquitectura/pruebas.mjs

      - name: Archivos generados del modelo de carga al día
        run: node tools/modelo-de-carga/calcular.mjs --check

      - name: Capacidad para el requisito de 10.000 sesiones simultáneas
        run: node tools/modelo-de-carga/calcular.mjs --estricto

      - name: Vista interactiva del grafo al día
        run: node tools/vista-del-grafo/generar.mjs --check

      # Fase de código (AGENTS.md §5): las cuatro verificaciones de packages/.
      - name: Hexágono puro (INV_06, S1)
        run: npm run verify:hexagon

      - name: Contratos con Ajv estricto y version_contrato al día
        run: npm run verify:contracts

      - name: Presupuestos 3D del kernel
        run: npm run verify:3d-budgets

      - name: Tipos del núcleo y pruebas integrales
        run: npm run test:integral
